// ===================== PROVIDERS =====================
class LessonProgress {
  final bool completed;
  final int score;
  final int attempts;
  final DateTime? lastAttempt;

  LessonProgress({
    required this.completed,
    required this.score,
    required this.attempts,
    this.lastAttempt,
  });

  LessonProgress copyWith({
    bool? completed,
    int? score,
    int? attempts,
    DateTime? lastAttempt,
  }) {
    return LessonProgress(
      completed: completed ?? this.completed,
      score: score ?? this.score,
      attempts: attempts ?? this.attempts,
      lastAttempt: lastAttempt ?? this.lastAttempt,
    );
  }

  Map<String, dynamic> toJson() => {
    'completed': completed,
    'score': score,
    'attempts': attempts,
    'lastAttempt': lastAttempt?.toIso8601String(),
  };

  factory LessonProgress.fromJson(Map<String, dynamic> json) => LessonProgress(
    completed: json['completed'],
    score: json['score'],
    attempts: json['attempts'],
    lastAttempt: json['lastAttempt'] != null ? DateTime.parse(json['lastAttempt']) : null,
  );
}

class ProgressProvider extends ChangeNotifier {
  final SharedPreferences _prefs;
  Map<String, LessonProgress> _progress = {};
  int _totalPoints = 0;
  int _streakDays = 0;
  DateTime? _lastStudyDate;

  ProgressProvider(this._prefs) {
    _loadProgress();
  }

  Map<String, LessonProgress> get progress => _progress;
  int get totalPoints => _totalPoints;
  int get streakDays => _streakDays;

  void _loadProgress() {
    final data = _prefs.getString('lesson_progress');
    if (data != null) {
      final Map<String, dynamic> json = jsonDecode(data);
      _progress = json.map((key, value) =>
          MapEntry(key, LessonProgress.fromJson(value as Map<String, dynamic>)));
    }
    _totalPoints = _prefs.getInt('total_points') ?? 0;
    _streakDays = _prefs.getInt('streak_days') ?? 0;
    final lastStudy = _prefs.getString('last_study_date');
    if (lastStudy != null) {
      _lastStudyDate = DateTime.parse(lastStudy);
    }
    _updateStreak();
  }

  void _saveProgress() {
    final json = _progress.map((key, value) => MapEntry(key, value.toJson()));
    _prefs.setString('lesson_progress', jsonEncode(json));
    _prefs.setInt('total_points', _totalPoints);
    _prefs.setInt('streak_days', _streakDays);
    if (_lastStudyDate != null) {
      _prefs.setString('last_study_date', _lastStudyDate!.toIso8601String());
    }
    notifyListeners();
  }

  void _updateStreak() {
    final today = DateTime.now();
    if (_lastStudyDate == null) return;
    final difference = today.difference(_lastStudyDate!).inDays;
    if (difference == 0) return;
    if (difference == 1) {
      _streakDays++;
    } else if (difference > 1) {
      _streakDays = 0;
    }
  }

  void markLessonComplete(String lessonId, int score, int maxScore) {
    final progress = _progress[lessonId] ?? LessonProgress(completed: false, score: 0, attempts: 0, lastAttempt: null);
    _progress[lessonId] = progress.copyWith(
      completed: true,
      score: score,
      attempts: progress.attempts + 1,
      lastAttempt: DateTime.now(),
    );
    _totalPoints += score;
    _lastStudyDate = DateTime.now();
    _updateStreak();
    _saveProgress();
  }

  bool isLessonCompleted(String lessonId) {
    return _progress[lessonId]?.completed ?? false;
  }

  int getLessonScore(String lessonId) {
    return _progress[lessonId]?.score ?? 0;
  }

  double getUnitProgress(String unitId, List<String> lessonIds) {
    if (lessonIds.isEmpty) return 0.0;
    int completed = 0;
    for (var id in lessonIds) {
      if (isLessonCompleted(id)) completed++;
    }
    return completed / lessonIds.length;
  }

  void resetProgress() {
    _progress.clear();
    _totalPoints = 0;
    _streakDays = 0;
    _lastStudyDate = null;
    _saveProgress();
  }
}

class ThemeProvider extends ChangeNotifier {
  final SharedPreferences _prefs;
  bool _isDark = false;

  ThemeProvider(this._prefs) {
    _isDark = _prefs.getBool('dark_mode') ?? false;
  }

  bool get isDark => _isDark;
  ThemeMode get themeMode => _isDark ? ThemeMode.dark : ThemeMode.light;

  void toggleTheme() {
    _isDark = !_isDark;
    _prefs.setBool('dark_mode', _isDark);
    notifyListeners();
  }

  void setDarkMode(bool value) {
    _isDark = value;
    _prefs.setBool('dark_mode', _isDark);
    notifyListeners();
  }
}

