// ===================== MODELS =====================
class FlashcardModel {
  final String id;
  final String english, arabic, formula;
  final String category;
  final int difficultyLevel;
  final List<String> tags;
  final DateTime createdAt;

  const FlashcardModel({
    required this.id,
    required this.english,
    required this.arabic,
    this.formula = '',
    this.category = '',
    this.difficultyLevel = 1,
    this.tags = const [],
    required this.createdAt,
  });

  Map<String, dynamic> toJson() => {
    'id': id,
    'english': english,
    'arabic': arabic,
    'formula': formula,
    'category': category,
    'difficultyLevel': difficultyLevel,
    'tags': tags,
    'createdAt': createdAt.toIso8601String(),
  };

  factory FlashcardModel.fromJson(Map<String, dynamic> json) => FlashcardModel(
    id: json['id'],
    english: json['english'],
    arabic: json['arabic'],
    formula: json['formula'] ?? '',
    category: json['category'] ?? '',
    difficultyLevel: json['difficultyLevel'] ?? 1,
    tags: List<String>.from(json['tags'] ?? []),
    createdAt: DateTime.parse(json['createdAt']),
  );
}

class QuizModel {
  final String id;
  final String question;
  final List<String> options;
  final int answerIndex;
  final String explanation, explanationAr;
  final String category;
  final int points;

  const QuizModel({
    required this.id,
    required this.question,
    required this.options,
    required this.answerIndex,
    required this.explanation,
    required this.explanationAr,
    this.category = '',
    this.points = 10,
  });

  Map<String, dynamic> toJson() => {
    'id': id,
    'question': question,
    'options': options,
    'answerIndex': answerIndex,
    'explanation': explanation,
    'explanationAr': explanationAr,
    'category': category,
    'points': points,
  };

  factory QuizModel.fromJson(Map<String, dynamic> json) => QuizModel(
    id: json['id'],
    question: json['question'],
    options: List<String>.from(json['options']),
    answerIndex: json['answerIndex'],
    explanation: json['explanation'],
    explanationAr: json['explanationAr'],
    category: json['category'] ?? '',
    points: json['points'] ?? 10,
  );
}

class Lesson {
  final String id;
  final String title, titleAr;
  final List<FlashcardModel> cards;
  final List<QuizModel> quiz;
  final String description, descriptionAr;
  final int estimatedMinutes;
  final List<String> prerequisites;
  final DateTime lastUpdated;

  const Lesson({
    required this.id,
    required this.title,
    required this.titleAr,
    required this.cards,
    required this.quiz,
    this.description = '',
    this.descriptionAr = '',
    this.estimatedMinutes = 15,
    this.prerequisites = const [],
    required this.lastUpdated,
  });

  Map<String, dynamic> toJson() => {
    'id': id,
    'title': title,
    'titleAr': titleAr,
    'cards': cards.map((c) => c.toJson()).toList(),
    'quiz': quiz.map((q) => q.toJson()).toList(),
    'description': description,
    'descriptionAr': descriptionAr,
    'estimatedMinutes': estimatedMinutes,
    'prerequisites': prerequisites,
    'lastUpdated': lastUpdated.toIso8601String(),
  };

  factory Lesson.fromJson(Map<String, dynamic> json) => Lesson(
    id: json['id'],
    title: json['title'],
    titleAr: json['titleAr'],
    cards: (json['cards'] as List).map((c) => FlashcardModel.fromJson(c)).toList(),
    quiz: (json['quiz'] as List).map((q) => QuizModel.fromJson(q)).toList(),
    description: json['description'] ?? '',
    descriptionAr: json['descriptionAr'] ?? '',
    estimatedMinutes: json['estimatedMinutes'] ?? 15,
    prerequisites: List<String>.from(json['prerequisites'] ?? []),
    lastUpdated: DateTime.parse(json['lastUpdated']),
  );
}

class StudyUnit {
  final String id;
  final String number, title, titleAr;
  final List<Lesson> lessons;
  final String description, descriptionAr, icon;
  final int progress;
  final DateTime createdAt;

  const StudyUnit({
    required this.id,
    required this.number,
    required this.title,
    required this.titleAr,
    required this.lessons,
    this.description = '',
    this.descriptionAr = '',
    this.icon = '📚',
    this.progress = 0,
    required this.createdAt,
  });

  Map<String, dynamic> toJson() => {
    'id': id,
    'number': number,
    'title': title,
    'titleAr': titleAr,
    'lessons': lessons.map((l) => l.toJson()).toList(),
    'description': description,
    'descriptionAr': descriptionAr,
    'icon': icon,
    'progress': progress,
    'createdAt': createdAt.toIso8601String(),
  };

  factory StudyUnit.fromJson(Map<String, dynamic> json) => StudyUnit(
    id: json['id'],
    number: json['number'],
    title: json['title'],
    titleAr: json['titleAr'],
    lessons: (json['lessons'] as List).map((l) => Lesson.fromJson(l)).toList(),
    description: json['description'] ?? '',
    descriptionAr: json['descriptionAr'] ?? '',
    icon: json['icon'] ?? '📚',
    progress: json['progress'] ?? 0,
    createdAt: DateTime.parse(json['createdAt']),
  );
}

