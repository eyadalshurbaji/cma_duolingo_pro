  State<QuizScreen> createState() => _QuizScreenState();
}

class _QuizScreenState extends State<QuizScreen> with SingleTickerProviderStateMixin {
  int _currentIndex = 0, _score = 0, _selectedIndex = -1;
  bool _isAnswered = false;
  late AnimationController _animationController;

  List<QuizModel> get _quiz {
    if (widget.lesson.quiz.isEmpty) {
      return [QuizModel(id: 'default', question: 'What is the Current Ratio formula?', options: ['CA/CL', 'Quick Ratio', 'Cash Ratio', 'Debt/Equity'], answerIndex: 0, explanation: 'Current Ratio = CA/CL', explanationAr: 'نسبة التداول = CA/CL', points: 10)];
    }
    return widget.lesson.quiz;
  }

  @override
  void initState() {
    super.initState();
    _animationController = AnimationController(duration: const Duration(milliseconds: 500), vsync: this);
  }

  @override
  void dispose() { _animationController.dispose(); super.dispose(); }

  void _selectOption(int index) {
    if (_isAnswered) return;
    setState(() {
      _isAnswered = true;
      _selectedIndex = index;
      if (index == _quiz[_currentIndex].answerIndex) _score += _quiz[_currentIndex].points;
    });
    _animationController.forward(from: 0.0);
  }

  void _nextQuestion() {
    if (_currentIndex < _quiz.length - 1) {
      setState(() { _currentIndex++; _isAnswered = false; _selectedIndex = -1; });
      _animationController.value = 0.0;
    } else {
      final progress = context.read<ProgressProvider>();
      progress.markLessonComplete(widget.lesson.id, _score, _quiz.fold(0, (sum, q) => sum + q.points));
      showDialog(
        context: context,
        barrierDismissible: false,
        builder: (context) => AlertDialog(
          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
          title: Row(children: [const Icon(Icons.emoji_events, color: Colors.amber, size: 32), const SizedBox(width: 12), Text(_score >= _quiz.length * 8 ? '🌟 Excellent!' : 'Good Effort!')]),
          content: Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [
            Text('Your Score: $_score / ${_quiz.fold(0, (sum, q) => sum + q.points)}', style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
            const SizedBox(height: 8),
            Text('Correct: ${_quiz.where((q) => _quiz.indexOf(q) < _currentIndex + 1 && q.answerIndex == _selectedIndex).length} / ${_quiz.length}', style: const TextStyle(fontSize: 16)),
            const SizedBox(height: 16),
            Container(padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: AppColors.primaryLight, borderRadius: BorderRadius.circular(12)), child: Row(children: [const Icon(Icons.local_fire_department, color: Colors.orange), const SizedBox(width: 8), Text('🔥 ${progress.streakDays} day streak', style: const TextStyle(fontWeight: FontWeight.bold))])),
          ]),
          actions: [
            TextButton(onPressed: () { Navigator.pop(context); Navigator.pop(context); Navigator.pop(context); }, child: const Text('Back to Units')),
            ElevatedButton(onPressed: () { Navigator.pop(context); setState(() { _currentIndex = 0; _score = 0; _isAnswered = false; _selectedIndex = -1; }); }, style: ElevatedButton.styleFrom(backgroundColor: AppColors.primary, foregroundColor: Colors.white), child: const Text('Retry Quiz')),
          ],
        ),
      );
    }
  }

  @override
  Widget build(BuildContext context) {
    final quiz = _quiz[_currentIndex];
    return Scaffold(
      appBar: AppBar(
        title: Text('Quiz: ${widget.lesson.titleAr}', style: const TextStyle(fontSize: 14)),
        actions: [Padding(padding: const EdgeInsets.only(right: 16), child: Center(child: Row(children: [const Icon(Icons.star, color: Colors.amber, size: 20), const SizedBox(width: 4), Text('$_score', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16))])))],
      ),
      body: Padding(
        padding: const EdgeInsets.all(16),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [Text('Question ${_currentIndex + 1}/${_quiz.length}', style: TextStyle(color: Colors.grey.shade600, fontWeight: FontWeight.w500)), Text('${_currentIndex + 1}/${_quiz.length}', style: const TextStyle(fontWeight: FontWeight.bold))]),
            const SizedBox(height: 8),
            LinearProgressIndicator(value: (_currentIndex + 1) / _quiz.length, backgroundColor: Colors.grey.shade200, valueColor: const AlwaysStoppedAnimation<Color>(AppColors.primary)),
            const SizedBox(height: 24),
            Text(quiz.question, style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold, height: 1.5)),
            const SizedBox(height: 24),
            Expanded(child: ListView.builder(itemCount: quiz.options.length, itemBuilder: (context, index) => QuizOption(text: quiz.options[index], index: index, selectedIndex: _selectedIndex, isAnswered: _isAnswered, correctIndex: quiz.answerIndex, onTap: () => _selectOption(index)))),
            if (_isAnswered) ...[
              Container(padding: const EdgeInsets.all(16), decoration: BoxDecoration(color: _selectedIndex == quiz.answerIndex ? AppColors.successLight : AppColors.errorLight, borderRadius: BorderRadius.circular(12)), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                Row(children: [Icon(_selectedIndex == quiz.answerIndex ? Icons.check_circle : Icons.cancel, color: _selectedIndex == quiz.answerIndex ? AppColors.success : AppColors.error), const SizedBox(width: 8), Text(_selectedIndex == quiz.answerIndex ? '✅ Correct! +${quiz.points} points' : '❌ Incorrect', style: const TextStyle(fontWeight: FontWeight.bold))]),
                const SizedBox(height: 8),
                Text(quiz.explanationAr, style: TextStyle(color: Colors.grey.shade700, fontSize: 14)),
              ])),
              const SizedBox(height: 16),
              SizedBox(width: double.infinity, height: 56, child: ElevatedButton(onPressed: _nextQuestion, style: ElevatedButton.styleFrom(backgroundColor: AppColors.primary, foregroundColor: Colors.white, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16))), child: Text(_currentIndex < _quiz.length - 1 ? 'Next Question →' : 'See Results 🏆', style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold)))),
            ],
          ],
        ),
      ),
    );
  }
}

class SettingsScreen extends StatelessWidget {
  const SettingsScreen({super.key});

  @override
  Widget build(BuildContext context) {
    final themeProvider = context.watch<ThemeProvider>();
    final progress = context.watch<ProgressProvider>();

    return Scaffold(
      appBar: AppBar(title: const Text('Settings'), leading: IconButton(icon: const Icon(Icons.arrow_back), onPressed: () => Navigator.pop(context))),
      body: ListView(
        children: [
          const SizedBox(height: 8),
          _buildSection('Appearance', children: [
            SwitchListTile(title: const Text('Dark Mode'), subtitle: const Text('Toggle dark/light theme'), value: themeProvider.isDark, onChanged: (value) => themeProvider.setDarkMode(value), secondary: const Icon(Icons.dark_mode)),
          ]),
          _buildSection('Progress', children: [
            ListTile(leading: const Icon(Icons.star, color: Colors.amber), title: const Text('Total Points'), trailing: Text('${progress.totalPoints} pts')),
            ListTile(leading: const Icon(Icons.local_fire_department, color: Colors.orange), title: const Text('Streak'), trailing: Text('${progress.streakDays} days')),
            ListTile(leading: const Icon(Icons.school), title: const Text('Completed Lessons'), trailing: Text('${progress.progress.length}')),
            ListTile(leading: const Icon(Icons.delete, color: AppColors.error), title: const Text('Reset Progress'), trailing: TextButton(onPressed: () => _showResetDialog(context), child: const Text('Reset', style: TextStyle(color: AppColors.error)))),
          ]),
          _buildSection('About', children: [
            const ListTile(leading: Icon(Icons.info), title: Text('Version'), trailing: Text('2.0.0')),
            ListTile(leading: const Icon(Icons.share), title: const Text('Share App'), onTap: () => Share.share('Check out CMA Duolingo Pro! 📚')),
            ListTile(leading: const Icon(Icons.feedback), title: const Text('Send Feedback'), onTap: () => _sendFeedback(context)),
          ]),
          const SizedBox(height: 24),
          Center(child: Text('CMA Duolingo Pro v2.0.0', style: TextStyle(color: Colors.grey.shade400, fontSize: 12))),
        ],
      ),
    );
  }

  Widget _buildSection(String title, {required List<Widget> children}) {
    return Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
      Padding(padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8), child: Text(title, style: TextStyle(color: Colors.grey.shade600, fontWeight: FontWeight.bold, fontSize: 14))),
      ...children,
      const SizedBox(height: 8),
    ]);
  }

  void _showResetDialog(BuildContext context) {
    showDialog(context: context, builder: (context) => AlertDialog(
      title: const Text('Reset Progress?'),
      content: const Text('This will delete all your progress, points, and streak. This action cannot be undone.'),
      actions: [
        TextButton(onPressed: () => Navigator.pop(context), child: const Text('Cancel')),
        ElevatedButton(onPressed: () { context.read<ProgressProvider>().resetProgress(); Navigator.pop(context); ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Progress reset successfully'))); }, style: ElevatedButton.styleFrom(backgroundColor: AppColors.error, foregroundColor: Colors.white), child: const Text('Reset')),
      ],
    ));
  }

  void _sendFeedback(BuildContext context) {
    showDialog(context: context, builder: (context) => AlertDialog(
      title: const Text('Send Feedback'),
      content: const TextField(maxLines: 5, decoration: InputDecoration(hintText: 'Your feedback...', border: OutlineInputBorder())),
      actions: [
        TextButton(onPressed: () => Navigator.pop(context), child: const Text('Cancel')),
        ElevatedButton(onPressed: () { Navigator.pop(context); ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Thank you for your feedback!'))); }, child: const Text('Send')),
      ],
    ));
  }
}

// ===================== MAIN APP =====================
void main() async {
  WidgetsFlutterBinding.ensureInitialized();
  final prefs = await SharedPreferences.getInstance();
  runApp(
    MultiProvider(
      providers: [
        ChangeNotifierProvider(create: (_) => ProgressProvider(prefs)),
        ChangeNotifierProvider(create: (_) => ThemeProvider(prefs)),
      ],
      child: const CmaProApp(),
    ),
  );
}

class CmaProApp extends StatelessWidget {
  const CmaProApp({super.key});

  @override
  Widget build(BuildContext context) {
    final themeProvider = context.watch<ThemeProvider>();
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'CMA Duolingo Pro',
      theme: AppTheme.lightTheme,
      darkTheme: AppTheme.darkTheme,
      themeMode: themeProvider.themeMode,
      home: const SplashScreen(),
      routes: {
        '/units': (context) => const UnitsListScreen(),
        '/settings': (context) => const SettingsScreen(),
      },
    );
  }
}
