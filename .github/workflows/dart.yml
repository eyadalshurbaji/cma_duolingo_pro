class ProgressBar extends StatelessWidget {
  final double progress;
  final Color color, backgroundColor;
  final double height;
  const ProgressBar({super.key, required this.progress, this.color = Colors.blue, this.backgroundColor = Colors.grey, this.height = 8});

  @override
  Widget build(BuildContext context) {
    return ClipRRect(
      borderRadius: BorderRadius.circular(height / 2),
      child: LinearProgressIndicator(
        value: progress.clamp(0.0, 1.0),
        backgroundColor: backgroundColor,
        valueColor: AlwaysStoppedAnimation<Color>(color),
        minHeight: height,
      ),
    );
  }
}

class Flashcard extends StatelessWidget {
  final FlashcardModel card;
  final bool showArabic;
  final VoidCallback onTap;
  final Animation<double> flipAnimation;

  const Flashcard({super.key, required this.card, required this.showArabic, required this.onTap, required this.flipAnimation});

  @override
  Widget build(BuildContext context) {
    final isFront = !showArabic;
    final rotation = isFront ? (1.0 - flipAnimation.value) : flipAnimation.value;

    return GestureDetector(
      onTap: onTap,
      child: AnimatedBuilder(
        animation: flipAnimation,
        builder: (context, child) {
          return Transform(
            alignment: Alignment.center,
            transform: Matrix4.identity()
              ..setEntry(3, 2, 0.001)
              ..rotateX(rotation * 3.14159265),
            child: child,
          );
        },
        child: Container(
          width: double.infinity,
          padding: const EdgeInsets.all(24),
          decoration: BoxDecoration(
            color: Colors.white,
            borderRadius: BorderRadius.circular(24),
            border: Border.all(color: Colors.grey.shade200, width: 2),
            boxShadow: [BoxShadow(color: Colors.black.withOpacity(0.05), blurRadius: 20, offset: const Offset(0, 4))],
          ),
          child: Column(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              Icon(showArabic ? Icons.translate : Icons.lightbulb_outline, size: 48, color: showArabic ? AppColors.primary : Colors.orange),
              const SizedBox(height: 20),
              Text(showArabic ? card.arabic : card.english, textAlign: TextAlign.center, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, height: 1.6)),
              if (card.formula.isNotEmpty) ...[
                const SizedBox(height: 20),
                Container(
                  padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                  decoration: BoxDecoration(color: AppColors.primaryLight, borderRadius: BorderRadius.circular(12), border: Border.all(color: AppColors.primary.withOpacity(0.2))),
                  child: Text(card.formula, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: AppColors.primary)),
                ),
              ],
              if (card.tags.isNotEmpty) ...[
                const SizedBox(height: 16),
                Wrap(spacing: 8, children: card.tags.map((tag) => Container(
                  padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                  decoration: BoxDecoration(color: Colors.grey.shade100, borderRadius: BorderRadius.circular(12)),
                  child: Text('#$tag', style: TextStyle(fontSize: 11, color: Colors.grey.shade600)),
                )).toList()),
              ],
              const SizedBox(height: 16),
              Text(showArabic ? 'اضغط للترجمة إلى الإنجليزية' : 'Tap to translate to Arabic', style: TextStyle(fontSize: 12, color: Colors.grey.shade400)),
            ],
          ),
        ),
      ),
    );
  }
}

class QuizOption extends StatelessWidget {
  final String text;
  final int index, selectedIndex, correctIndex;
  final bool isAnswered;
  final VoidCallback onTap;

  const QuizOption({super.key, required this.text, required this.index, required this.selectedIndex, required this.isAnswered, required this.correctIndex, required this.onTap});

  @override
  Widget build(BuildContext context) {
    Color backgroundColor = Colors.white;
    Color borderColor = Colors.grey.shade300;
    IconData? icon;

    if (isAnswered) {
      if (index == correctIndex) {
        backgroundColor = AppColors.successLight;
        borderColor = AppColors.success;
        icon = Icons.check_circle;
      } else if (index == selectedIndex && index != correctIndex) {
        backgroundColor = AppColors.errorLight;
        borderColor = AppColors.error;
        icon = Icons.cancel;
      }
    } else if (selectedIndex == index) {
      borderColor = AppColors.primary;
      backgroundColor = AppColors.primaryLight;
    }

    return Container(
      margin: const EdgeInsets.only(bottom: 12),
      decoration: BoxDecoration(
        color: backgroundColor,
        borderRadius: BorderRadius.circular(12),
        border: Border.all(color: borderColor, width: 2),
      ),
      child: Material(
        color: Colors.transparent,
        child: InkWell(
          onTap: onTap,
          borderRadius: BorderRadius.circular(12),
          child: Padding(
            padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 14),
            child: Row(
              children: [
                Container(
                  width: 28, height: 28,
                  decoration: BoxDecoration(
                    shape: BoxShape.circle,
                    color: isAnswered
                        ? (index == correctIndex ? AppColors.success : (index == selectedIndex && index != correctIndex ? AppColors.error : Colors.grey.shade200))
                        : (selectedIndex == index ? AppColors.primary : Colors.grey.shade200),
                  ),
                  child: Center(
                    child: isAnswered && (index == correctIndex || (index == selectedIndex && index != correctIndex))
                        ? Icon(icon, size: 18, color: Colors.white)
                        : Text(
                            String.fromCharCode(65 + index),
                            style: TextStyle(
                              color: isAnswered ? (index == correctIndex || (index == selectedIndex && index != correctIndex) ? Colors.white : Colors.grey.shade600)
                                  : (selectedIndex == index ? Colors.white : Colors.grey.shade600),
                              fontWeight: FontWeight.bold,
                              fontSize: 13,
                            ),
                          ),
                  ),
                ),
                const SizedBox(width: 16),
                Expanded(
                  child: Text(text, style: TextStyle(
                    fontSize: 16,
                    color: isAnswered && index == correctIndex ? AppColors.success
                        : (isAnswered && index == selectedIndex && index != correctIndex ? AppColors.error : Colors.black87),
                    fontWeight: selectedIndex == index ? FontWeight.w600 : FontWeight.w400,
                  )),
                ),
                if (isAnswered && index == correctIndex) const Icon(Icons.check_circle, color: AppColors.success, size: 20),
                if (isAnswered && index == selectedIndex && index != correctIndex) const Icon(Icons.cancel, color: AppColors.error, size: 20),
              ],
            ),
          ),
        ),
      ),
    );
  }
}

