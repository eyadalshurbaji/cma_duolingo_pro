class FlashcardsScreen extends StatefulWidget {
  final Lesson lesson;
  const FlashcardsScreen({super.key, required this.lesson});

  @override
  State<FlashcardsScreen> createState() => _FlashcardsScreenState();
}

class _FlashcardsScreenState extends State<FlashcardsScreen> with SingleTickerProviderStateMixin {
  int _currentIndex = 0;
  bool _showArabic = false;
  late AnimationController _animationController;
  late Animation<double> _flipAnimation;
  late ConfettiController _confettiController;

  @override
  void initState() {
    super.initState();
    _animationController = AnimationController(duration: const Duration(milliseconds: 300), vsync: this);
    _flipAnimation = Tween<double>(begin: 0, end: 1).animate(CurvedAnimation(parent: _animationController, curve: Curves.easeInOut));
    _confettiController = ConfettiController(duration: const Duration(seconds: 2));
    _animationController.addListener(() {
      if (_flipAnimation.value > 0.5) setState(() => _showArabic = !_showArabic);
    });
  }

  @override
  void dispose() { _animationController.dispose(); _confettiController.dispose(); super.dispose(); }

  void _flipCard() => _animationController.forward(from: 0.0);

  void _nextCard() {
    if (_currentIndex < widget.lesson.cards.length - 1) {
      setState(() { _currentIndex++; _showArabic = false; });
      _animationController.value = 0.0;
    } else {
      _confettiController.play();
      showDialog(
        context: context,
        barrierDismissible: false,
        builder: (context) => AlertDialog(
          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
          title: const Text('🎉 Lesson Complete!'),
          content: Column(mainAxisSize: MainAxisSize.min, children: [
            const Text('You\'ve reviewed all flashcards!', style: TextStyle(fontSize: 16)),
            const SizedBox(height: 16),
            Text('${widget.lesson.cards.length} cards reviewed', style: const TextStyle(fontWeight: FontWeight.bold)),
          ]),
          actions: [
            TextButton(onPressed: () { Navigator.pop(context); Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => QuizScreen(lesson: widget.lesson))); }, child: const Text('Start Quiz →')),
          ],
        ),
      );
    }
  }

  @override
  Widget build(BuildContext context) {
    final card = widget.lesson.cards[_currentIndex];
    final progress = (_currentIndex + 1) / widget.lesson.cards.length;
    return Scaffold(
      appBar: AppBar(
        title: Text(widget.lesson.titleAr, style: const TextStyle(fontSize: 14)),
        bottom: PreferredSize(
          preferredSize: const Size.fromHeight(6),
          child: Container(height: 6, child: LinearProgressIndicator(value: progress, backgroundColor: Colors.white.withOpacity(0.3), valueColor: const AlwaysStoppedAnimation<Color>(Colors.white))),
        ),
      ),
      body: Stack(
        children: [
          Padding(
            padding: const EdgeInsets.all(20),
            child: Column(
              children: [
                Container(padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8), decoration: BoxDecoration(color: AppColors.primaryLight, borderRadius: BorderRadius.circular(20)), child: Text('${_currentIndex + 1} / ${widget.lesson.cards.length}', style: const TextStyle(fontWeight: FontWeight.bold, color: AppColors.primary))),
                const SizedBox(height: 20),
                Expanded(child: Flashcard(card: card, showArabic: _showArabic, onTap: _flipCard, flipAnimation: _flipAnimation)),
                const SizedBox(height: 20),
                Row(children: [
                  Expanded(child: ElevatedButton(onPressed: _currentIndex > 0 ? () { setState(() { _currentIndex--; _showArabic = false; _animationController.value = 0.0; }); } : null, style: ElevatedButton.styleFrom(backgroundColor: Colors.grey.shade200, foregroundColor: AppColors.textPrimary, elevation: 0), child: const Text('← Previous'))),
                  const SizedBox(width: 16),
                  Expanded(child: ElevatedButton(onPressed: _nextCard, style: ElevatedButton.styleFrom(backgroundColor: AppColors.primary, foregroundColor: Colors.white), child: Text(_currentIndex < widget.lesson.cards.length - 1 ? 'Next →' : 'Finish 🎯'))),
                ]),
                const SizedBox(height: 8),
                Text('Tap card to flip', style: TextStyle(color: Colors.grey.shade400, fontSize: 12)),
              ],
            ),
          ),
          Align(alignment: Alignment.topCenter, child: ConfettiWidget(confettiController: _confettiController, blastDirectionality: BlastDirectionality.explosive, particleDrag: 0.05, emissionFrequency: 0.05, numberOfParticles: 20, gravity: 0.1, shouldLoop: false, colors: const [Colors.red, Colors.blue, Colors.green, Colors.yellow, Colors.purple, Colors.orange])),
        ],
      ),
    );
  }
}

